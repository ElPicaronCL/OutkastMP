name: CI Pipeline

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  neon-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate project artifacts
        run: tools/neon generate project --json

      - name: Check project
        run: tools/neon check --json

      - name: Verify agent context
        run: tools/neon context verify --json
