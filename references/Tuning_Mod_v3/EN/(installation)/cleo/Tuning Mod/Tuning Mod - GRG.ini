;------ Helper
;
[Helper]
; = Color the world (ambient, sky etc) when entering the garage. "Int" Interior (general) and "Ext" Exterior (motorbike, airplanes etc).
; By default "33" where it makes the vehicles a little brighter and the sky is dark. You may possibly want to disable the color change in the outdoor garages, if you like, put "-1" to disable.
; Using high numbers like "33" will make everything black if you use SkyGfx with mobile colorcycle.
WorldColor_Int = 33
WorldColor_Ext = 33

; = Add a light where the camera is. Very useful as it will help to illuminate the vehicle, but in some graphics may not be necessary. To disable, enter "-1"
; Light range (meters):
PointLight_Range_Int = 10.0
PointLight_Range_Ext = 10.0
; Light power (0 up to 255):
PointLight_Power_Int = 80
PointLight_Power_Ext = 80



