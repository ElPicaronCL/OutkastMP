;
;      .ini file of the Tuning Mod by Junior_Djjr
;       MixMods.com.br - TuningMod.MixMods.com.br
;
;=================== General configurations of the Tuning Mod.
;
[CONFG]
; 1 = Português | 2 = English (lembre-se, há estes arquivos em português no download em MixMods.com.br)
Language = 2

; = Show the intro message when you enter the garage. After showing once, the mod will automatically disabe this to not appear again. If it continues to appear, set "0" below or open the game in admin mode. If it still doesn't work, remember not to have GTA installed in "Program Files" for better operation of this and other mods.
Intro = 1

; = What to do if you are in SAMP: 0 = Nothing (normal); 1 = Disable the mod; 2 = Do not apply changes that can be considered cheating, like handling changes. - Aside: If the .fxt file is not loaded in SAMP, use SAMP FXT Fix: www.MixMods.com.br/2016/08/samp-fxt-fix-corrigir-mods-fxt-no-samp.html
SAMPmode = 2

; = Enable tire wear. The system changes the behavior of your car, making it skid more if worn tires etc, besides the fact that the tires burst. If you don't like these realisms and you think it's a mess in gameplay, turn it off by setting "0".
TireWear = 1

; = Enable dynamic change of the vehicle value depending on the installed tuning parts, damages, tire wear etc. Note that the extra parts added by Tuning Mod doesn't change the value. The value of the vehicle is based on the value in the handling line, and this value, if it is high, can trigger people looking at your car, thieves trying to steal it etc.
VehValue = 1

; = Command preference when installing the part. 1 = Follow car angle; 2 = Follow camera angle (NFS Carbon and NFS Pro Street style commands). This can be changed during installation using the "B" key.
CmdPrefer = 1

; = Show part preview on the car model (only available for parts with that adaptation).
PartPreview = 1

; = Show pivot (XYZ axis) of the part.
ShowPivot = 1

; = Enable vehicle auto-save while building to prevent you from losing your jobs. You can enable/disable inside the game using TAB+T. The .TMV file is saved in "CLEO\Tuning Mod\Vehicles\AutoSave\AutoSave.tmv". Only one vehicle will be saved automatically, which is the last vehicle used in the mod. The autosaving happens only inside the mod.
AutoSave = 1

; = Show garage icons on radar. If you saved the game with this mod installed, the icons will remain in the saved game even without the mod installed. To remove them, disable this, save the game again, and so you can uninstall the mod.
ShowRadarIcons = 1

; = Your name. This will be used as default if you don't put the name of the author at the time of saving the car. USE AT LEAST 16 CHARACTERS.
VehAuthor = Unknown

; = Speed multiplier of the movement and rotation when installing a part. Can be edited in-game via middle mouse button.
MoveSpeed = 1.0

; = Car stats multiplier. For example if you usually use handlings that make the cars faster, you may prefer to set the speed values for about 0.5 so the bar counts half the value; 0.7 for 70% of the value etc.
Acce = 1.0  # Acceleration
MSpe = 1.0  # Max Speed
Stab = 1.0  # Stability
Brak = 1.0  # Brakes

