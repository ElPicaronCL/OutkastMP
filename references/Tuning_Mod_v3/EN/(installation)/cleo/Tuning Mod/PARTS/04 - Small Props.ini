# What?    - This file contains the parts list that appears during the in-game part choose interface.
# How?     - Add the name of the DFF files or the IDs of the templates to appear in the list. One per line under "[PARTS]". It isn't necessary to type ".dff". You can find the names or IDs in various places on the internet (dev.prineside.com/gtasa_samp_model_id) or in the game files themselves.
# Caution! - Be careful with the organization of the lines, they can easily not be loaded or badly loaded. DO NOT USE SPACE AT THE BEGINNING OF THE LINE!!!
# Tip:     - You can load a vehicle or even a part of it. For example, put a "chassis 400" line to have the "chassis" of Landstalker, where "chassis" is the name of the part and "400" is the Landstalker ID ("landstal") located at "data\vehicles.ide"
# Limits!  - Each name has a limit of 19 letters and can't contain spaces.
# Update:  - "EXTRAS" now is "PARTS".
# More:    - Download new parts in the blog: https://TuningMod.MixMods.com.br - In each Readme.txt file comes the name of the parts, just copy and paste here. IF PROBLEMS OR DOUBTS, READ THE README OF THE PART THAT YOU DOWNLOADED.
# Doubts?  - https://TuningMod.MixMods.com.br/2015/03/como-instalar-novas-pecas-no-tuning-mod.html

