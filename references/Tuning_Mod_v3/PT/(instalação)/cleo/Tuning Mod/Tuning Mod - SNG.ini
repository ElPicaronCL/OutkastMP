;=================== Configurações da música
;
[Songs]
; = Turn on background music? [1 or 0] - You can add as many songs as you want in the "Songs" folder, CAUTION! First read the "_READ OR CRASH.txt". Possibly the song will not work on SA-MP
EnableBgMusic = 1
 
; = Enable ambient depth effect in music
3dBgMusic = 1

; = Enable bass and reverb effects if you have the "MDPMv5" (or higher) mod installed.
EnableFX = 1

; = Background song volume [0.0 até 1.0]
VolBgMusic = 1.0

; = Enable the random mode
RandomMode = 1

; = Always use the same first song when entering the garage, even with random mode enabled.
UseFirstSong = 0

; = Radio model ID (changes in all garages). Example: 2103
RadioModel = 2103
