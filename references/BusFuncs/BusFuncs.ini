[Settings]
; EN - Generate log file (0 - No, 1 - Yes)
; ES - Crear archivo log (0 - No, 1 - Si)
; PT - Gerar arquivo log (0 - Não, 1 - Sim)
Log=1

; EN - Bus driver render (0 - No, 1 - Yes)
; PT - Renderizar o motorista do ônibus (0 - Não, 1 - Sim)
BusDriverRender=0

; WheelTurnSpeed (0.2)
WheelTurnSpeed=0.025

[Commands]
; EN - Main key to open/close doors
; PT - Tecla principal para abrir/fechar as portas
DoorKey_Main=107	; Num+

; Teclas para pressionar junto com a MainKey
; EN - Open/Close Right Front Door
; PT - Abre/fecha a porta dianteira do lado direito
DoorKey_RF=97		; Num1

; EN - Open/Close Right Medium Door
; PT - Abre/fecha a porta do meio do lado direito
DoorKey_RM=98		; Num2

; EN - Open/Close Right Rear Door
; PT - Abre/fecha a porta traseira do lado direito
DoorKey_RR=99		; Num3

; EN - Open/Close Left Front Door
; PT - Abre/fecha a porta dianteira do lado esquerdo
DoorKey_LF=100		; Num4

; EN - Open/Close Left Rear Door
; PT - Abre/fecha a porta traseira do lado esquerdo
DoorKey_LR=101		; Num5

; EN - Open/Close Slide Door
; PT - Abre/fecha a porta de correr (SlideDoor)
DoorKey_Slide=109	; Num-

; EN - Open/Close Right Front Door of the wagon.
; PT - Abre/fecha a porta dianteira do lado direito do articulado.
DoorKey_ARF=102		; Num6

; EN - Open/Close Right Rear Door of the wagon.
; PT - Abre/fecha a porta traseira do lado direito do articulado.
DoorKey_ARR=103		; Num7

; EN - Open/Close Left Front Door of the wagon.
; PT - Abre/fecha a porta dianteira do lado esquerdo do articulado.
DoorKey_ALF=104		; Num8

; EN - Open/Close Left Rear Door of the wagon.
; PT - Abre/fecha a porta traseira do lado esquerdo do articulado.
DoorKey_ALR=105		; Num9
