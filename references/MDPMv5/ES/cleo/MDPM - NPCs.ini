[Settings]
# Coloque "0" para desactivar completamente los coches en la calle tocando el sonido.
# Recuerde que si usted utiliza archivos de música pesados, la tendencia es que el juego cause pequeños golpes durante el juego, debido a la carga de las canciones de los NPC.
EnableNPCs = 1

# Chances generales durante el día. Si usted cree que, en general, los vehículos están apareciendo con mucho, o poco, disminuir o aumentar este valor (0-100+).
GlobalDayChance = 25

# Igual arriba. Durante la noche después de las 22 horas.
GlobalNightChance = 10

# No activar en conductores con "pedstat" de personas mayores etc. El mod es más realista.
LimitPedStat = 1

# Aceptar coches adaptados para ignorar las configuraciones "Models" abajo, así el propio .dff también podrá dar información al coche activar. Esto funciona con una adaptación a VehFuncs.
AllowCustom = 1

# Volumen general. Reduzca o aumente para ajustar el volumen de todos los NPC. Por ejemplo 0.5 disminuirá a la mitad el volumen del configurado abajo.
GlobalVolume = 1.0


# A continuación puedes configurar fácilmente qué coches aparecerán tocando sonido.
# Siéntase libre de eliminar y añadir nuevos, pero tenga cuidado con el número de la orden!
# El nombre del vehículo después de "#" no se lee, es sólo una nota. Pero evite escribir algo MUY largo allí.

