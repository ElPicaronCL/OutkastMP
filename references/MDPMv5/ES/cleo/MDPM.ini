##########################################################
#
#  Arquivo de configurações do MDPMv5 (MixMods.com.br)
#
##########################################################
[Settings]
# -- Idioma / Language
#  1 = English
#  2 = Português
#  3 = Español
Language = 3

# -- Tutorial
#  Si colocas ("0") el tutorial no volverá a mostrarse después de abrir el mod por primera vez. Puedes colocar ("1") para ver el tutorial nuevamente la próxima vez que abras el mod.
Tutorial = 1

# - Activación alternativa
# Además de escribir "MDPM" o usar la tecla de medios para activar y desactivar el mod, puede configurar a continuación un comando alternativo: https://www.mixmods.com.br/p/virtual-keys-br.html
# Usando números debajo de 20, se utilizarán los botones del control: https://gtagmodding.com/sanandreas/pads/
AltKey = -1

# -- Skin
#  Nombre de la skin. Por ejemplo "SKIN1" cargará el archivo "CLEO\MDPM Skins\MDPM - Player (SKIN1).ini". Si está vacío, cargará el "DEFAULT".
#  - Descargar skins: Forum.MixMods.com.br/f9-mdpm
#  - Crear skins: Forum.MixMods.com.br/f52-tutoriais/t14-mdpmv5-como-criar-skins
SkinName = DEFAULT



[Sound]
# -- Volumen original.
# El volumen del reproductor de música al conectar el mod.
# Entre 0.0 y 1.0 (1.0 = volumen 30, 0.5 = volumen 15 etc).
DefaultVolume = 1.0


# -- Modo 3D
#  Modo 1 = Direccional — Escucharás la música con efecto direccional (con respecto al veículo), es más realista. Si el sonido se escucha bajo, aumenta el volumen de tu PC y baja el volumen del juego.
#  Modo 2 = 2.5D — Escucharás el sonido de la música en un 3D falso, donde solamente varía el volumen de la música y no la dirección. Sonido alto y claro, música estéreo, sin bugs, pero menos realista.
3DMode = 1
# Abajo, un regulador de volumen [0.0-1.0]
# Probablemente querrás bajar el volumen del modo 2, porque es demasiado alto.
VolumeMode1 = 1.0
VolumeMode2 = 0.7


# -- Aumento de graves por ecualización.
# Utilice entre 0.0 y 3.0, siendo que 3.0 causa mucha distorsión.
# El uso del número negativo baja el grave, y 0.0 desactiva el ecualizador para utilizar el sonido original.
BassBoostEQLevel = 0.6


# -- Bass booster VST
# Si "BassBoosterLevel" es mayor que 0.0, el MDPM cargará el "bass plugins\vst\BassLandscapes.dll". También es necesario "bass_vst.asi". Ya viene con el mod en la carpeta "modloader/Bass VST".
# Se trata de un plugin VST que utiliza un algoritmo de aumento de graves, puede utilizar junto con el de arriba. Desactive (y borre el bass_vst.asi) en caso de problemas.
# El efecto es realista y no causa distorsión, pero puede dejar el volumen de la música más baja.
BassBoosterLevel  = 1.0    # Intensidad del boost (0.0-1.0+)
BassBoosterLow    = 1.0    # Subgraves (0.0-1.0+). Bueno para simular subwoofers. Si el sonido de su PC o auricular no tiene subwoofer, deje 0.0 para no entorpecer otras frecuencias.
BassBoosterMid    = 1.0    # Graves-medios (0.0-1.0+). Bueno para simular woofers.

# !!! A continuación es sólo para usuarios avanzados (experimental) !!!
# Usted puede cambiar el "BassLandscapes.dll" por otro plugin VST (conservando el nombre) e cambiar los ID de los parámetros a continuación para adaptarse a la nueva.
Param1 = 2  # ID de parámetro "Level"
Param2 = 3  # ID de parámetro "Low"
Param3 = 4  # ID de parámetro "Mid"

