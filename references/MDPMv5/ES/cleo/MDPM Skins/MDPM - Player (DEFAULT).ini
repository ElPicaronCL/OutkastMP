##########################################################
#
#  Archivo del skin de MDPMv5.1 (MixMods.com.br)
#  Descarga o aprende a crear skins aquí: Forum.MixMods.com.br/f52-tutoriais/t14-mdpmv5-como-criar-skins
#
#  Autor de la skin: Junior_Djjr
#
##########################################################
 
[Player]

# Nombre del TXD — nombre del archivo .txd en la carpeta "models\txd\". Máximo 7 letras, y debes usar nombres únicos.
# Por ejemplo: "MDPMPLA" cargará el archivo "models\txd\MDPMPLA.txd" (inclusive dentro del ModLoader).
TxdName = MDPMPLA


# Espectro — Las barritas que se mueven de acuerdo a la frecuencia de la música.
Spectrum_Mode = 1     # Formato del espectro. [1 = Centralizado, 2 = A partir de bajos]
Spectrum_Bars = 45    # Número de barras que se muestran en el espectro. Ten cuidado al usar números muy altos, porque puede pasarse del límite de agudos y no aparecerán correctamente. También querrás editar el "Spectrum_BarDistX" y "Spectrum_BarSizX".


# Posición y tamaño del reproductor — Esto en realidad puede ser configurado in-game con el mouse. Basta apretar el botón del medio para mover; botón del medio + botón derecho para cambiar el tamaño; botón del medio + botón derecho + botón izquierdo para alargar.
# Por defecto: 500.0; 400.0; 125.0; 100.0
GeralPosX = 500.0
GeralPosY = 400.0
GeralSizX = 125.0
GeralSizY = 100.0

# Tamaño mínimo. De forma predeterminada 25.0 y 20.0 (5X menor).
MinGeralSizX = 25.0
MinGeralSizY = 20.0


# Configuraciones para el espectro,
Spectrum_OffsetPosX   = -30.0     # Posición X (derecha-izquierda).
Spectrum_OffsetPosY   = 5.0       # Posición Y (arriba-abajo) al usar "Spectrum_Mode = 1".
Spectrum_OffsetPosY2  = 15.0      # Posición Y (arriba-abajo) al usar "Spectrum_Mode = 2".
Spectrum_BarDistX     = 2.5       # Distancia entre cada barrita. Un consejo: aumentar el número de barritas (Spectrum_Bars) y disminuir la distancia entre ellas.
Spectrum_BarSizX      = 2.0       # Largo de cada barrita.
Spectrum_BarSizY_Mult = 33.0      # Tamaño vertical de la barrita (cuánto puede subir).
Spectrum_BarSizY_Min  = 0.5       # Tamaño mínimo de la barrita (si usas resolución baja, lo recomendado es aumentar hasta 1.0, aproximadamente).
Spectrum_BarSizY_Max  = 25.0      # Límite de tamaño de la barra. Puede ser necesario aumentar esto si aumentaste el "Spectrum_BarSizY_Mult". Y vice-versa.


# Colores (en RGB 0~255).
# Color del reproductor de música (va a pintar la textura "mdpm-color" del .txd de la skin).
Player_Color_R  = 0           # Rojo
Player_Color_G  = 228         # Verde
Player_Color_B  = 255         # Azul
#
# Color del texto y el espectro.
Text_Color_R    = 0           # Rojo
Text_Color_G    = 228         # Verde
Text_Color_B    = 255         # Azul
#
# Color del icono de play/pause.
PlayPause_Color_R    = 0          # Rojo
PlayPause_Color_G    = 228        # Verde
PlayPause_Color_B    = 255        # Azul


# Texto en la parte de abajo (nombre de la canción),
Text_UseSecModeWhen    = 75.0     # El segundo modo de texto será usado si el reproductor tiene un largo menor que este número, osea, por defecto, si el reproductor está pequeño el texto sale de la pantalla y queda abajo del reproductor.
FooterText_OffsetPosX  = -32.0    # Posición X (derecha-izquierda).
FooterText_OffsetPosY  = 19.0     # Posición Y (arriba-abajo).
FooterText_OffsetPosX2 = 0.0      # Posición X (derecha-izquierda) - Para el segundo modo.
FooterText_OffsetPosY2 = 37.0     # Posición Y (arriba-abajo) - Para el segundo modo.
FooterText_LetterSizX  = 0.13     # Largo de las letras.
FooterText_LetterSizY  = 0.6      # Altura de las letras.
FooterText_LetterSizX2 = 0.13     # Largo de las letras - Para el segundo modo.
FooterText_LetterSizY2 = 0.6      # Alto de las letras - Para el segundo modo.
FooterText_CharsLimit  = 33       # Limite de letras para aparecer en la parte de abajo del visor.


# Ítems del menú en el visor,
MenuText_OffsetPosX  = -30.0    # Posición X (derecha-izquierda).
MenuText_OffsetPosY  = -14.0    # Posición Y (arriba-abajo).
MenuText_ItemDistY   = 6.0      # Distancia entre cada ítem.
MenuText_LetterSizX  = 0.22     # Largo de las letras.
MenuText_LetterSizY  = 0.73     # Alto de las letras.


# Textos grandes en el visor (por ejemplo, el volumen),
DisplayBigText_OffsetPosX  = -25.0  # Posición X (derecha-izquierda).
DisplayBigText_OffsetPosY  = 0.0    # Posición Y (arriba-abajo).
DisplayBigText_LetterSizX  = 0.5    # Largo de las letras.
DisplayBigText_LetterSizY  = 1.0    # Alto de las letras.


# Íconos, como la alerta de FPS y el bloqueo de comandos.
HeaderIcons_OffsetPosX = 80.0     # Posición X (derecha-izquierda).
HeaderIcons_OffsetPosY = -12.0    # Posición Y (arriba-abajo).
HeaderIcons_SizX       = 8.0      # Tamaño X (horizontal).
HeaderIcons_SizY       = 10.0     # Tamaño Y (vertical).
HeaderIcons_DistanceX  = 10.0     # Distancia horizontal entre los iconos.

# Nombre y handle del coche
CarName_OffsetPosY  = 0.6   # Posición Y (arriba-abajo). Es una multiplicación de la altura total, por lo que los números pequeños, generalmente 0.6.


# Ícono Play/Pause.
PlayPause_OffsetPosX    = -55.0   # Posição X (direita-esquerda).
PlayPause_OffsetPosY    = 20.0    # Posição Y (cima-baixo).
PlayPause_SizX          = 6.5     # Tamanho X (horizontal).
PlayPause_SizY          = 8.0     # Tamanho Y (vertical).
