##########################################################
#
#  Arquivo de skin do MDPMv5.1 (MixMods.com.br)
#  Baixe ou aprenda a criar skins aqui: Forum.MixMods.com.br/f52-tutoriais/t14-mdpmv5-como-criar-skins
#
#  Autor da skin: Junior_Djjr
#
##########################################################

[Player]

# Nome do TXD — nome do arquivo .txd na pasta "models\txd\". Máximo 7 letras e use nomes únicos.
# Por exemplo "MDPMPLA" carregará o "models\txd\MDPMPLA.txd" (inclusive dentro do ModLoader).
TxdName = MDPMPLA


# Spectrum — as barrinhas pulando com a frequência da música.
Spectrum_Mode = 1     # Formato do spectrum. [1 = Centralizado, 2 = A partir de baixo]
Spectrum_Bars = 45    # Número de barras para serem mostradas no spectrum. Cuidado em usar um número muito alto aqui, senão irá passar do limite de agudos e mostrar errado. Você vai querer também editar o "Spectrum_BarDistX" e "Spectrum_BarSizX".


# Posição e tamanho do player — Isso na verdade pode ser configurado in-game com o mouse. Basta segurar o botão do meio para mover; botão do meio + botão direito para mudar o tamanho; botão do meio + botão direito + botão esquerdo para esticar.
# Por padrão: 500.0; 400.0; 125.0; 100.0
GeralPosX = 500.0
GeralPosY = 400.0
GeralSizX = 125.0
GeralSizY = 100.0

# Tamanho mínimo. Por padrão 25.0 e 20.0 (5X menor).
MinGeralSizX = 25.0
MinGeralSizY = 20.0


# Configurações para o spectrum.
Spectrum_OffsetPosX   = -30.0     # Posição X (direita-esquerda).
Spectrum_OffsetPosY   = 5.0       # Posição Y (cima-baixo) ao usar "Spectrum_Mode = 1".
Spectrum_OffsetPosY2  = 15.0      # Posição Y (cima-baixo) ao usar "Spectrum_Mode = 2".
Spectrum_BarDistX     = 2.5       # Distância entre cada barrinha. Uma dica é aumentar o número de barrinhas (Spectrum_Bars) e diminuir a distância entre elas.
Spectrum_BarSizX      = 2.0       # Largura de cada barrinha.
Spectrum_BarSizY_Mult = 33.0      # Tamanho vertical da barrinha (o quanto ela pode subir).
Spectrum_BarSizY_Min  = 0.5       # Tamanho mínimo da barrinha (se você usa resoluções baixas, o recomendado é aumentar para uns 1.0).
Spectrum_BarSizY_Max  = 25.0      # Limite de tamanho da barra. Pode ser necessário aumentar isso caso você tenha aumentado o "Spectrum_BarSizY_Mult". E vice versa.


# Cores (em RGB 0~255).
# Cor do player de música (irá pintar a textura "mdpm-color" do .txd da skin).
Player_Color_R  = 0           # Vermelho
Player_Color_G  = 228         # Verde
Player_Color_B  = 255         # Azul
#
# Cor do texto e spectrum.
Text_Color_R    = 0           # Vermelho
Text_Color_G    = 228         # Verde
Text_Color_B    = 255         # Azul
#
# Cor do ícone de play/pause.
PlayPause_Color_R    = 0          # Vermelho
PlayPause_Color_G    = 228        # Verde
PlayPause_Color_B    = 255        # Azul


# Texto no rodapé (nome da música).
Text_UseSecModeWhen    = 75.0     # O segundo modo de texto será usado caso o player tenha a largura menor do que este número, ou seja, por padrão, quanto o player estiver pequeno texto sai da tela e vai pra baixo dele.
FooterText_OffsetPosX  = -32.0    # Posição X (direita-esquerda).
FooterText_OffsetPosY  = 19.0     # Posição Y (cima-baixo).
FooterText_OffsetPosX2 = 0.0      # Posição X (direita-esquerda) - Para o segundo modo.
FooterText_OffsetPosY2 = 37.0     # Posição Y (cima-baixo) - Para o segundo modo.
FooterText_LetterSizX  = 0.13     # Largura das letras.
FooterText_LetterSizY  = 0.6      # Altura das letras.
FooterText_LetterSizX2 = 0.13     # Largura das letras - Para o segundo modo.
FooterText_LetterSizY2 = 0.6      # Altura das letras - Para o segundo modo.
FooterText_CharsLimit  = 33       # Limite de letras para aparecer no rodapé do visor.


# Itens do menu no visor.
MenuText_OffsetPosX  = -30.0    # Posição X (direita-esquerda).
MenuText_OffsetPosY  = -14.0    # Posição Y (cima-baixo).
MenuText_ItemDistY   = 6.0      # Distância de um ítem para o outro.
MenuText_LetterSizX  = 0.22     # Largura das letras.
MenuText_LetterSizY  = 0.73     # Altura das letras.


# Textos grandes no visor (por exemplo, volume).
DisplayBigText_OffsetPosX  = -25.0  # Posição X (direita-esquerda).
DisplayBigText_OffsetPosY  = 0.0    # Posição Y (cima-baixo).
DisplayBigText_LetterSizX  = 0.5    # Largura das letras.
DisplayBigText_LetterSizY  = 1.0    # Altura das letras.


# Ícones, como alerta de FPS e bloqueio de comandos.
HeaderIcons_OffsetPosX = 80.0     # Posição X (direita-esquerda).
HeaderIcons_OffsetPosY = -12.0    # Posição Y (cima-baixo).
HeaderIcons_SizX       = 8.0      # Tamanho X (horizontal).
HeaderIcons_SizY       = 10.0     # Tamanho Y (vertical).
HeaderIcons_DistanceX  = 10.0     # Distância horizontal entre os ícones.


# Nome e handle do carro.
CarName_OffsetPosY  = 0.6   # Posição Y (cima-baixo). É uma multiplicação da altura total, por isso números pequenos, geralmente 0.6.


# Ícone Play/Pause.
PlayPause_OffsetPosX    = -55.0   # Posição X (direita-esquerda).
PlayPause_OffsetPosY    = 20.0    # Posição Y (cima-baixo).
PlayPause_SizX          = 6.5     # Tamanho X (horizontal).
PlayPause_SizY          = 8.0     # Tamanho Y (vertical).

