##########################################################
#
#  Arquivo de configurações do MDPMv5 (MixMods.com.br)
#
##########################################################
[Settings]
# -- Idioma / Language
#  1 = English
#  2 = Português
#  3 = Español
Language = 2

# -- Tutorial
#  Após o mod ser rodado pela primeira vez, desativará ("0"). Você pode colocar "1" novamente para ver o tutorial de introdução de novo quando ativar o mod.
Tutorial = 1

# -- Ativação alternativa
#  Além de digitar "MDPM" ou usar a tecla de mídia para ativar e desativar o mod, você pode configurar abaixo um comando alternativo: https://www.mixmods.com.br/p/virtual-keys-br.html
#  Usando números abaixo de 20, será usado os botões do controle: https://gtagmodding.com/sanandreas/pads/
AltKey = -1

# -- Skin
#  Nome da skin. Por exemplo "SKIN1" carregará o arquivo "CLEO\MDPM Skins\MDPM - Player (SKIN1).ini". Vazio carrega a "DEFAULT".
#  - Baixar skins: Forum.MixMods.com.br/f9-mdpm
#  - Criar skins: Forum.MixMods.com.br/f52-tutoriais/t14-mdpmv5-como-criar-skins
SkinName = DEFAULT



[Sound]
# -- Volume padrão.
# Será o volume do tocador de música quando liga o mod.
# Entre 0.0 e 1.0 (1.0 = volume 30, 0.5 = volume 15 etc).
DefaultVolume = 1.0


# -- Modo 3D
#  Modo 1 = Direcional — Você ouvirá o som da música com efeito 3D direcional ao veículo, mais realista. Se o som ficar baixo aumente o volume do seu PC e abaixe o volume do jogo.
#  Modo 2 = 2.5D — Você ouvirá o som da música em um 3D falso onde varia somente o volume e não a direção. Som alto e claro, música estéreo, livre de bugs, mas menos realista.
3DMode = 1
# Abaixo, uma regulagem de volume final [0.0-1.0]
# Provavelmente você vai querer abaixar o volume do modo 2, devido a ele ser alto demais.
VolumeMode1 = 1.0
VolumeMode2 = 0.7


# -- Aumento de graves por equalização.
# Use entre 0.0 e 3.0, sendo que 3.0 causa muita distorção.
# Usar número negativo abaixa o grave, e 0.0 desativa o equalizador para usar o som original.
BassBoostEQLevel = 0.6


# -- Bass booster VST
# Caso "BassBoosterLevel" ser maior do que 0.0, o MDPM carregará o "bass plugins\vst\BassLandscapes.dll". Também necessário "bass_vst.asi". Já vem com o mod na pasta "modloader/Bass VST".
# Se trata de um plugin VST que usa um algoritimo de aumento de graves, você pode usar junto com o de cima. Desative (e apague o bass_vst.asi) em caso de problemas.
# O efeito é realista e não causa distorção, mas pode deixar o volume da música um mais baixo.
BassBoosterLevel  = 1.0    # Intensidade do boost (0.0-1.0+)
BassBoosterLow    = 1.0    # Subgraves (0.0-1.0+). Bom para simular subwoofers. Se o som do seu PC ou headphone não tem subwoofer, deixe 0.0 para não atrapalhar outras frequências.
BassBoosterMid    = 1.0    # Graves-médios (0.0-1.0+). Bom para simular woofers.

# !!! Abaixo é somente para usuários avançados (experimental) !!!
# Você pode trocar o "BassLandscapes.dll" por outro plugin VST (preservando o nome) e trocar os IDs dos parâmetros abaixo para se adequar ao novo.
Param1 = 2  # ID do parâmetro "Level"
Param2 = 3  # ID do parâmetro "Low"
Param3 = 4  # ID do parâmetro "Mid"

