[Settings]
# Coloque "0" para desativar completamente carros na rua tocando som.
# Lembre-se que se você usa arquivos de música pesados, a tendência é que o jogo cause pequenos engasgos durante o gameplay, devido ao carregamento das músicas dos NPCs.
EnableNPCs = 1

# Chances gerais durante o dia. Se você acha que, em geral, os veículos estão aparecendo com muito, ou pouco, diminua ou aumente este valor (0-100+).
GlobalDayChance = 25

# Mesmo acima. Durante a noite após 22 horas.
GlobalNightChance = 10

# Não ativar em motoristas com "pedstat" de pessoas idosas etc. O mod fica mais realista.
LimitPedStat = 1

# Aceitar carros adaptados a ignorarem as configurações "Models" abaixo, assim o próprio .dff também poderá dar informações pro carro ativar. Isto funciona com uma adaptação ao VehFuncs.
AllowCustom = 1

# Volume geral. Diminua ou aumente para ajustar o volume de todos os NPCs. Por exemplo 0.5 diminuirá pela metade o volume do configurado abaixo.
GlobalVolume = 1.0


# Abaixo você pode configurar facilmente quais carros aparecerão tocando som.
# Sinta-se livre em remover e adicionar novos, mas tome cuidado com o número da ordem!
# O nome do veículo após "#" não é lido, é só uma anotação. Mas evite digitar algo MUITO longo ali.

