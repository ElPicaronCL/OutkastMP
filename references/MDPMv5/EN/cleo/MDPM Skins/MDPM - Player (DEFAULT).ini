##########################################################
#
#  MDPMv5.1 skin file (MixMods.com.br)
#  Download or lean how to create skins here: Forum.MixMods.com.br/f52-tutoriais/t14-mdpmv5-como-criar-skins
#
#  Skin author: Junior_Djjr
#
##########################################################

[Player]

# TXD name — name of the .txd file in folder "models\txd\". Max 7 characters and use unique names.
# For example "MDPMPLA" will load "models\txd\MDPMPLA.txd" (also inside ModLoader).
TxdName = MDPMPLA


# Spectrum — the bars moving with the music frequency.
Spectrum_Mode = 1     # Spectrum format. [1 = Centered, 2 = From below]
Spectrum_Bars = 45    # Number of bars to be displayed on the spectrum. Beware of using a very high number here, otherwise it will exceed the high limit and show it wrong. You may also want to edit the "Spectrum_BarDistX" and "Spectrum_BarSizX".


# Position and size of the player — this can actually be configured in-game with the mouse. Just hold the middle button to move; middle button + right button to resize; middle button + right button + left button to stretch.
# By default: 500.0; 400.0; 125.0; 100.0
GeralPosX = 500.0
GeralPosY = 400.0
GeralSizX = 125.0
GeralSizY = 100.0

# Minimum size. By default 25.0 and 20.0 (5X smaller).
MinGeralSizX = 25.0
MinGeralSizY = 20.0


# Spectrum settings.
Spectrum_OffsetPosX   = -30.0     # X position (right-left).
Spectrum_OffsetPosY   = 5.0       # Y position (up-down) when using "Spectrum_Mode = 1".
Spectrum_OffsetPosY2  = 15.0      # Y position (up-down) when using "Spectrum_Mode = 2".
Spectrum_BarDistX     = 2.5       # Distance between each bar. One tip is to increase the number of bars (Spectrum_Bars) and decrease the distance between them.
Spectrum_BarSizX      = 2.0       # Width of each bar.
Spectrum_BarSizY_Mult = 33.0      # Vertical bar size (how much it can rise).
Spectrum_BarSizY_Min  = 0.5       # Minimum bar size (if you use low resolutions, it is recommended to increase to about 1.0).
Spectrum_BarSizY_Max  = 25.0      # Bar size limit. You may need to increase this if you have increased Spectrum_BarSizY_Mult. And vice versa.


# Colors (in RGB 0~255).
# Color of the music player (will paint the "mdpm-color" texture from skin .txd).
Player_Color_R  = 0           # Red
Player_Color_G  = 228         # Green
Player_Color_B  = 255         # Blue
#
# Text color and spectrum.
Text_Color_R    = 0           # Red
Text_Color_G    = 228         # Green
Text_Color_B    = 255         # Blue
#
# Color del icono de play/pause.
PlayPause_Color_R    = 0          # Red
PlayPause_Color_G    = 228        # Green
PlayPause_Color_B    = 255        # Blue


# Text in footer (song name), relating to player settings.
Text_UseSecModeWhen    = 75.0     # The second text mode will be used if the player has the width smaller than this number, that is, by default, when the player is small, text goes out of the screen and goes below it.
FooterText_OffsetPosX  = -32.0    # X position (right-left).
FooterText_OffsetPosY  = 19.0     # Y position (up-down).
FooterText_OffsetPosX2 = 0.0      # X position (right-left) - For second mode.
FooterText_OffsetPosY2 = 37.0     # Y position (up-down) - For second mode.
FooterText_LetterSizX  = 0.13     # Letter Width.
FooterText_LetterSizY  = 0.6      # Letter height.
FooterText_LetterSizX2 = 0.13     # Letter Width - For second mode.
FooterText_LetterSizY2 = 0.6      # Letter height - For second mode.
FooterText_CharsLimit  = 33       # Limit of letters to appear in the footer of the display.


# Display menu items, relating to player settings.
MenuText_OffsetPosX  = -30.0    # X position (right-left).
MenuText_OffsetPosY  = -14.0    # Y position (up-down).
MenuText_ItemDistY   = 6.0      # Distance between the items.
MenuText_LetterSizX  = 0.22     # Width of letters.
MenuText_LetterSizY  = 0.73     # Height of the letters.


# Large texts in display (for example, volume), relating to player settings.
DisplayBigText_OffsetPosX  = -25.0  # X position (right-left).
DisplayBigText_OffsetPosY  = 0.0    # Y position (up-down).
DisplayBigText_LetterSizX  = 0.5    # Width of letters.
DisplayBigText_LetterSizY  = 1.0    # Height of the letters.


# Icons such as FPS alert and command blocking.
HeaderIcons_OffsetPosX = 80.0     # X position (right-left).
HeaderIcons_OffsetPosY = -12.0    # Y position (up-down).
HeaderIcons_SizX       = 8.0      # X size (horizontal).
HeaderIcons_SizY       = 10.0     # Y size (vertical).
HeaderIcons_DistanceX  = 10.0     # Horizontal distance between the icons.


# Car name and handle
CarName_OffsetPosY  = 0.6   # Y position (up-down). It's a multiplication of the total height, so small numbers, usually 0.6.


# Play/Pause icon.
PlayPause_OffsetPosX    = -55.0   # X position (right-left).
PlayPause_OffsetPosY    = 20.0    # Y position (up-down).
PlayPause_SizX          = 6.5     # X size (horizontal).
PlayPause_SizY          = 8.0     # Y size (vertical).

