[Settings]
# Put "0" to completely disable cars playing song on street.
# Remember that if you use heavy music files, the tendency is for the game to cause minor gaps during the gameplay, due to loading songs from NPCs.
EnableNPCs = 1

# General chances during the day. If you think that, in general, vehicles are appearing too much or too little, decrease or increase this value (0-100+).
GlobalDayChance = 25

# Same up. Overnight after 22 hours.
GlobalNightChance = 10

# Don't activate on drivers with "pedstat" of elderly people etc. The mod will be more realistic.
LimitPedStat = 1

# Accept adapted cars to ignore the "Models" settings below, so the .dff itself can also give information to the car to activate. This works with an adaptation to VehFuncs.
AllowCustom = 1

# Overall volume. Decrease or increase to adjust the volume of all NPCs. For example 0.5 will be half of the volume configured below.
GlobalVolume = 1.0


# Below you can easily configure which cars will appear playing sound.
# Feel free to remove and add new ones, but be careful with the order number!
# The vehicle name after "#" is not read, it's just a note. But avoid typing something VERY long there.

