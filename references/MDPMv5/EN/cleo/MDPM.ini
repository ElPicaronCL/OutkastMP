##########################################################
#
#  MDPMv5 settings file (MixMods.com.br)
#
##########################################################
[Settings]
# -- Idioma / Language
#  1 = English
#  2 = Português
#  3 = Español
Language = 1

# -- Tutorial
#  After the mod is first run, it will disable ("0"). You can put "1" again to see the introductory tutorial again when activating the mod.
Tutorial = 1

# -- Alternative activation
#  In addition to typing "MDPM" or using the media key to toggle the mod on-off, you can set up bellow an alternative command: https://www.mixmods.com.br/p/virtual-keys-br.html
#  Using numbers below 20, the control buttons will be used: https://gtagmodding.com/sanandreas/pads/
AltKey = -1

# -- Skin
#  Skin name. For example "SKIN1" will load the file "CLEO\MDPM Skins\MDPM - Player (SKIN1).ini". Empty loads the "DEFAULT".
#  - Download skins: Forum.MixMods.com.br/f9-mdpm
#  - Create skins: Forum.MixMods.com.br/f52-tutoriais/t14-mdpmv5-como-criar-skins
SkinName = DEFAULT


[Sound]
# -- Default volume.
# It will be the volume of the music player when you turn on the mod.
# Use between 0.0 and 1.0 (1.0 = volume 30, 0.5 = volume 15 etc).
DefaultVolume = 1.0

# -- Bass boost mode. Choose which one you like best.
#  4 = Increases the bass a lot. The sound gets bad and distorted; greater sense of noise.
#  3 = Greatly increases the bass. It can create distortion and make the sound bad.
#  2 = Slightly increase the bass. Little distortion.
#  1 = Lower the high frequencies. The sound will play lower for more bass, so increase the volume of your PC and lower the volume of the game to have a good result. No distortion.
#  0 = Disabled. Original song sound.
BassBoostLevel = 3

# -- 3D mode
#  Mode 1 = Directional - You'll hear the music sound with 3D directional effect to the vehicle, more realistic. If you think the volume low, turn down the game volume and increase your PC volume.
#  Mode 2 = 2.5D — You will hear the song sound in a fake 3D where only the volume changes, not the direction. Sound loud and clear, stereo music, bug free, but less realistic.
3DMode = 1
# Bellow, a volume control [0.0-1.0]
# You will probably want to lower the volume of mode 2, because it is too loud.
VolumeMode1 = 1.0
VolumeMode2 = 0.7

