[Settings]


; Ativar/desativar o mod.
EnableMod = 1


; Idioma/Language [0=English | 1=Português] - If you are english, remember that have a english version of this .ini in download.
Language = 1


; Checar se você está usando o Crack 1.0 US (o mod só funciona nele), caso falso-positivo, desative isso.
CheckEXE = 1



;------ Câmeras ------
; Ativar:     "enhcam1" 2 ou 3
; Desativar:  "enhcam"
;
; X, Y e Z  = Posição da camera referente ao player (offset)
: Tilt      = Inclinação da camera
;

[CAM1]
X=0.6
Y=0.9
Z=1.0
TILT=0.0

[CAM2]
X=-0.5
Y=1.0
Z=1.0
TILT=0.0

[CAM3]
X=0.5
Y=0.9
Z=0.8
TILT=0.0
